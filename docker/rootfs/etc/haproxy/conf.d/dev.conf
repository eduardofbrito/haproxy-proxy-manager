# Development mode configuration
# Admin panel on port 81

frontend admin_http
    bind *:81
    mode http

    # Admin API
    acl is_api path_beg /api/
    use_backend backend_api if is_api

    # Frontend assets
    default_backend backend_frontend

backend backend_api
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-Port 81
    http-response set-header X-Served-By "%[hostname]"
    server api 127.0.0.1:3000 check

backend backend_frontend
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-Port 81
    http-response set-header X-Served-By "%[hostname]"
    # WebSocket support
    http-request set-header Upgrade "websocket" if { header(Upgrade) -i websocket }
    http-request set-header Connection "Upgrade" if { header(Upgrade) -i websocket }
    server frontend 127.0.0.1:5173 check
