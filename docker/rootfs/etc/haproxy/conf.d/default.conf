# "You are not configured" page - default if another default doesn't exist

# Default HTTP frontend (port 80)
frontend default_http
    bind *:80
    mode http

    # Set default server for fallback
    default_backend default_backend_http

    # ACME challenge support for Let's Encrypt
    acl acme_challenge path_beg /.well-known/acme-challenge/
    use_backend acme_challenge_backend if acme_challenge

    # Allow access to letsencrypt challenge files
    allow 10.0.0.0/8
    allow 172.16.0.0/12
    allow 192.168.0.0/16

    # Serve the default "not configured" page
    http-request set-path /index.html if { path / }
    http-request set-var(txn.path) path
    http-response set-header X-Served-By "%[res(haproxy),lower]"

backend default_backend_http
    mode http
    server localhost 127.0.0.1:80 check

# ACME challenge backend
backend acme_challenge_backend
    mode http
    server localhost 127.0.0.1:80 check

# Default HTTPS frontend (port 443) - reject handshake for unknown hosts
frontend default_https
    bind *:443 ssl crt-list /etc/haproxy/certs/list.txt alpn h2,http/1.1
    mode http

    # Reject all connections for unknown hosts
    http-request deny deny_status 444 if !{ ssl_fc_sni -f /etc/haproxy/certs/known_sni.lst }

    # Serve default page for any connection that gets through
    default_backend default_backend_https

backend default_backend_https
    mode http
    server localhost 127.0.0.1:443 check
