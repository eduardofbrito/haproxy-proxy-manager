<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 140" width="400" height="112">
  <defs>
    <style>
      .brand-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 52px;
        font-weight: 800;
        fill: #545454;
        letter-spacing: -1px;
      }
      .brand-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 22px;
        font-weight: 500;
        fill: #858585;
        letter-spacing: 0px;
      }
    </style>
    <linearGradient id="hashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#F7931E"/>
      <stop offset="100%" stop-color="#FFB835"/>
    </linearGradient>
  </defs>
  
  <!-- HAProxy logo hash symbol -->
  <g transform="translate(10, 10)">
    <rect width="65" height="120" rx="8" fill="url(#hashGrad)"/>
    <text x="32.5" y="78" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white">#</text>
  </g>
  
  <!-- Text -->
  <text x="85" y="68" class="brand-text">Proxy</text>
  <text x="85" y="108" class="brand-sub">Manager</text>
</svg>
