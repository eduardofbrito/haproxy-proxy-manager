{% if certificate and certificate_id > 0 -%}
{% if certificate.provider == "letsencrypt" %}
# Let's Encrypt SSL for stream
{% set cert_path = "/etc/letsencrypt/live/npm-" + certificate_id + "/fullchain.pem" %}
{% set key_path = "/etc/letsencrypt/live/npm-" + certificate_id + "/privkey.pem" %}
ssl crt {{ cert_path }}
{%- else %}
# Custom SSL for stream
{% set cert_path = "/data/custom_ssl/npm-" + certificate_id + "/fullchain.pem" %}
{% set key_path = "/data/custom_ssl/npm-" + certificate_id + "/privkey.pem" %}
ssl crt {{ cert_path }}
{%- endif -%}
{%- endif -%}
