# ------------------------------------------------------------
# {{ domain_names | join: ", " }}
# Redirect Host
# ------------------------------------------------------------

{% if enabled %}

# Frontend: Redirection
frontend fe_redir_{{ id }}
  bind *:80
  {% if ipv6 -%}
  bind *[::]:80
  {% else -%}
  # bind *[::]:80
  {% endif %}

  {% if certificate and certificate_id > 0 -%}
  bind *:443 ssl crt {{ certificate.cert_path }} alpn h2,http/1.1
  {% if ipv6 -%}
  bind *[::]:443 ssl crt {{ certificate.cert_path }} alpn h2,http/1.1
  {% else -%}
  # bind *[::]:443 ssl crt {{ certificate.cert_path }} alpn h2,http/1.1
  {% endif %}
  {% endif %}

  # Default HTTP to HTTPS redirect
  redirect scheme https code 301 if !{ ssl_fc }

  # Host ACLs
  acl host_domain hdr(host) -i {% for domain in domain_names %}{{ domain }}{% if not loop.last %}|{% endif %}{% endfor %}

  # HSTS
  {% if certificate and certificate_id > 0 -%}
  {% if ssl_forced == 1 or ssl_forced == true -%}
  {% if hsts_enabled == 1 or hsts_enabled == true -%}
  http-response set-header Strict-Transport-Security "{{ hsts_header }}"
  {% endif %}
  {% endif %}
  {% endif %}

  # Security Headers
  http-response set-header X-Content-Type-Options nosniff
  http-response set-header X-XSS-Protection "1; mode=block"

  # Force SSL
  {% if certificate and certificate_id > 0 -%}
  {% if ssl_forced == 1 or ssl_forced == true -%}
  http-request redirect scheme https unless { ssl_fc }
  {% endif %}
  {% endif %}

  # Advanced config injection
  {{ advanced_config }}

  # Redirect Rules
  # Redirect with optional path preservation
  {% if use_default_location %}
    {% if preserve_path == 1 or preserve_path == true %}
    # Preserve path in redirect
    http-request redirect code {{ forward_http_code }} prefix {{ forward_scheme }}://{{ forward_domain_name }} %[path] if host_domain
    {% else %}
    # Redirect to base URL only
    http-request redirect code {{ forward_http_code }} {{ forward_scheme }}://{{ forward_domain_name }} if host_domain
    {% endif %}
  {% else %}
    {% if preserve_path == 1 or preserve_path == true %}
    http-request redirect code {{ forward_http_code }} prefix {{ forward_scheme }}://{{ forward_domain_name }} %[path] if host_domain
    {% else %}
    http-request redirect code {{ forward_http_code }} {{ forward_scheme }}://{{ forward_domain_name }} if host_domain
    {% endif %}
  {% endif %}

  default_backend be_dummy_redir

# Dummy backend for unmatched
backend be_dummy_redir
  http-request deny deny_status 750
{% endif %}
