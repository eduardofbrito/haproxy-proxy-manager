# ------------------------------------------------------------
# {{ domain_names | join: ", " }}
# ------------------------------------------------------------

{% if enabled %}

{% include "_hsts_map.conf" %}

# Frontend: HTTP -> HTTPS redirect (if SSL not forced) and proxy pass
frontend fe_proxy_{{ id }}
  # Bind HTTP
  bind *:80
  {% if ipv6 -%}
  bind *[::]:80
  {% else -%}
  # bind *[::]:80
  {% endif %}

  # Bind HTTPS with SSL
  {% if certificate and certificate_id > 0 -%}
  bind *:443 ssl crt {{ certificate.cert_path }} alpn h2,http/1.1
  {% if ipv6 -%}
  bind *[::]:443 ssl crt {{ certificate.cert_path }} alpn h2,http/1.1
  {% else -%}
  # bind *[::]:443 ssl crt {{ certificate.cert_path }} alpn h2,http/1.1
  {% endif %}
  {% endif %}

  # Default HTTP to HTTPS redirect
  redirect scheme https code 301 if !{ ssl_fc }

  # Host ACLs
  acl host_domain hdr(host) -i {% for domain in domain_names %}{{ domain }}{% if not loop.last %}|{% endif %}{% endfor %}

  # WebSocket upgrade detection
  {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
  acl is_websocket hdr(Upgrade) -i WebSocket
  acl is_websocket hdr_beg(Connection) -i Upgrade
  {% endif %}

  # Security Headers
  http-response set-header X-Content-Type-Options nosniff
  http-response set-header X-XSS-Protection "1; mode=block"

  # HSTS
  {% if certificate and certificate_id > 0 -%}
  {% if ssl_forced == 1 or ssl_forced == true -%}
  {% if hsts_enabled == 1 or hsts_enabled == true -%}
  http-response set-header Strict-Transport-Security "{{ hsts_header }}"
  {% endif %}
  {% endif %}
  {% endif %}

  # Access Control
  {% if access_list_id > 0 %}
  {% if access_list.clients.length > 0 %}
  acl whitelist_allowed src {% for client in access_list.clients %}{% if client.directive == "allow" %}{% else %}-m {% endif %}{{ client.address }} {% endfor %}
  http-request deny deny_status 403 if host_domain !whitelist_allowed
  {% endif %}
  {% if access_list.items.length > 0 %}
  # Basic Auth required
  acl valid_auth ssl_verify_cert,first -m found
  http-request auth realm proxy-{{ id }} unless valid_auth
  {% endif %}
  {% endif %}

  # Block Exploits
  {% if block_exploits == 1 or block_exploits == true %}
  http-request deny deny_status 403 if { path_reg -(?:etc/|/proc/|\.env|wp-config) }
  {% endif %}

  # Forward Host Header
  http-request set-header X-Forwarded-Proto http{% if certificate and certificate_id > 0 %}s{% endif %}
  http-request set-header X-Forwarded-Port %[dst_port]
  http-request set-header X-Real-IP %[src]

  # Advanced config injection
  {{ advanced_config }}

  # Custom Locations
  {{ locations }}

  # Default Backend
  {% if use_default_location %}
  use_backend be_proxy_{{ id }}_default if host_domain
  {% else %}
  default_backend be_proxy_{{ id }}_default
  {% endif %}

# Backend: Proxy to upstream
backend be_proxy_{{ id }}_default
  {% if forwarding_scheme == "http" %}
  http-request set-header X-Forwarded-Proto http
  {% else %}
  http-request set-header X-Forwarded-Proto https
  {% endif %}
  http-request set-header Host {{ forward_host }}
  http-request set-header X-Forwarded-Proto {{ forward_scheme }}
  http-request set-header X-Forwarded-For %[src]

  # WebSocket support
  {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
  http-request set-header Upgrade %[hdr(Upgrade)]
  http-request set-header Connection %[hdr(Connection)]
  http-request set-header X-Forwarded-Proto {{ forward_scheme }}
  {% endif %}

  server server1 {{ forward_host }}:{{ forward_port }} check

  # Logging
  option httplog
  option dontlognull
{% endif %}
