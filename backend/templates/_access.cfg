{% if access_list_id > 0 %}
{% if access_list.items.length > 0 %}
# Authorization - Basic Auth
acl auth_valid bas_auth(auth_users)
http-request auth realm authorization if !auth_valid
{% endif %}

{% if access_list.clients.length > 0 %}
# Access Rules: {{ access_list.clients | size }} total
acl whitelist src {% for client in access_list.clients %}{% if client.directive == "allow" %}{% else %}-m {% endif %}{{ client.address }} {% endfor %}
{% for client in access_list.clients %}
acl allowed_{{ loop.index }} src {% if client.directive == "allow" %}{% else %}-m {% endif %}{{ client.address }}
{% endfor %}
http-request deny deny_status 403 if !whitelist
{% endif %}

# Access checks must...
{% if access_list.satisfy_any == 1 or access_list.satisfy_any == true %}
# satisfy any
{% else %}
# satisfy all
{% endif %}
{% endif %}
