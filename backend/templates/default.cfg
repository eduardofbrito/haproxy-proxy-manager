# ------------------------------------------------------------
# Default Site
# ------------------------------------------------------------

{% if value == "congratulations" %}
# Skipping output, congratulations page configuration is baked in.
{% else %}
# Frontend: Default site
frontend fe_default
  bind *:80 default
  {% if ipv6 -%}
  bind *[::]:80 default
  {% else -%}
  # bind *[::]:80 default
  {% endif %}

  server_name default-host.localhost

  # Security Headers
  http-response set-header X-Content-Type-Options nosniff
  http-response set-header X-XSS-Protection "1; mode=block"

  # ACME challenge support
  acl letsencrypt_challenge path_beg /.well-known/acme-challenge/
  http-request set-var(txn.acme_path) path_beg /.well-known/acme-challenge/
  http-request use-service lua.letsencrypt if letsencrypt_challenge

  {% if value == "404" %}
  # Return 404
  http-request return status 404 content-type "text/html" string "<html><body><h1>404 - Not Found</h1></body></html>"
  {% endif %}

  {% if value == "444" %}
  # Close connection without response (Nginx 444 = close without response)
  http-request return status 444
  {% endif %}

  {% if value == "redirect" %}
  # Redirect to specified URL
  http-request redirect code 301 {{ meta.redirect }}
  {% endif %}

  {% if value == "html" %}
  # Serve static files from /data/haproxy/default_www
  # Use static-file serving backend
  use_backend be_default_html
  {% endif %}

  default_backend be_dummy_default

# Static file backend
backend be_default_html
  http-request set-path / %[path]
  errorfile 404 /data/haproxy/default_www/404.html

# Dummy backend
backend be_dummy_default
  http-request deny deny_status 750
{% endif %}
