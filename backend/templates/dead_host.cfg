# ------------------------------------------------------------
# {{ domain_names | join: ", " }}
# Dead Host (404)
# ------------------------------------------------------------

{% if enabled %}

# Frontend: Dead host - returns 404
frontend fe_dead_{{ id }}
  bind *:80
  {% if ipv6 -%}
  bind *[::]:80
  {% else -%}
  # bind *[::]:80
  {% endif %}

  {% if certificate and certificate_id > 0 -%}
  bind *:443 ssl crt {{ certificate.cert_path }} alpn h2,http/1.1
  {% if ipv6 -%}
  bind *[::]:443 ssl crt {{ certificate.cert_path }} alpn h2,http/1.1
  {% else -%}
  # bind *[::]:443 ssl crt {{ certificate.cert_path }} alpn h2,http/1.1
  {% endif %}
  {% endif %}

  # Default HTTP to HTTPS redirect
  redirect scheme https code 301 if !{ ssl_fc }

  # Host ACLs
  acl host_domain hdr(host) -i {% for domain in domain_names %}{{ domain }}{% if not loop.last %}|{% endif %}{% endfor %}

  # HSTS
  {% if certificate and certificate_id > 0 -%}
  {% if ssl_forced == 1 or ssl_forced == true -%}
  {% if hsts_enabled == 1 or hsts_enabled == true -%}
  http-response set-header Strict-Transport-Security "{{ hsts_header }}"
  {% endif %}
  {% endif %}
  {% endif %}

  # Force SSL
  {% if certificate and certificate_id > 0 -%}
  {% if ssl_forced == 1 or ssl_forced == true -%}
  http-request redirect scheme https unless { ssl_fc }
  {% endif %}
  {% endif %}

  # Advanced config injection
  {{ advanced_config }}

  # Return 404 for all requests
  http-request return status 404 content-type "text/html" string "<html><body><h1>404 - Not Found</h1></body></html>" if host_domain

  default_backend be_dummy_dead

# Dummy backend
backend be_dummy_dead
  http-request deny deny_status 750
{% endif %}
