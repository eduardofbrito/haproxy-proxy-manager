# ------------------------------------------------------------
# HAProxy location block
# ------------------------------------------------------------

  # Location: {{ path }}
  acl loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }} path_beg {{ path }}
  acl loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }} path {{ path }}

  {% if block_exploits == 1 or block_exploits == true %}
  http-request deny deny_status 403 if loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }} { path_reg -(?:etc/|/proc/|\.env|wp-config) }
  {% endif %}

  # Access Control
  {% if access_list_id > 0 %}
  {% if access_list.clients.length > 0 %}
  acl loc_whitelist_allowed src {% for client in access_list.clients %}{% if client.directive == "allow" %}{% else %}-m {% endif %}{{ client.address }} {% endfor %}
  http-request deny deny_status 403 if loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }} !loc_whitelist_allowed
  {% endif %}
  {% endif %}

  # HSTS
  {% if certificate and certificate_id > 0 -%}
  {% if ssl_forced == 1 or ssl_forced == true -%}
  {% if hsts_enabled == 1 or hsts_enabled == true -%}
  http-response set-header Strict-Transport-Security "{{ hsts_header }}" if loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }}
  {% endif %}
  {% endif %}
  {% endif %}

  # Force SSL for location
  {% if certificate and certificate_id > 0 -%}
  {% if ssl_forced == 1 or ssl_forced == true -%}
  http-request redirect scheme https if loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }} !{ ssl_fc }
  {% endif %}
  {% endif %}

  # WebSocket upgrade
  {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
  acl is_websocket_loc hdr(Upgrade) -i WebSocket if loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }}
  acl is_websocket_loc hdr_beg(Connection) -i Upgrade if loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }}
  {% endif %}

  # Custom advanced config for location
  {{ advanced_config }}

  use_backend be_loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }} if loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }}

# Location backend
backend be_loc_{{ id }}_{{ path | replace: '/', '_' | replace: '-', '_' }}
  http-request set-header Host {{ forward_host }}
  http-request set-header X-Forwarded-Proto {{ forward_scheme }}
  http-request set-header X-Forwarded-For %[src]

  {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
  http-request set-header Upgrade %[hdr(Upgrade)]
  http-request set-header Connection %[hdr(Connection)]
  {% endif %}

  option httplog
  option dontlognull

  server server1 {{ forward_host }}:{{ forward_port }}{% if forward_path and forward_path != "/" %} check path {{ forward_path }}{% endif %}
