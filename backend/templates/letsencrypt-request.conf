# ------------------------------------------------------------
# HAProxy Config for Let's Encrypt ACME Challenge
# ------------------------------------------------------------

# Frontend: Let's Encrypt ACME Challenge
frontend fe_letsencrypt_{{ id }}
  bind *:80
  {% if ipv6 -%}
  bind *[::]:80
  {% else -%}
  # bind *[::]:80
  {% endif %}

  # ACME challenge ACL
  acl letsencrypt_challenge path_beg /.well-known/acme-challenge/

  # Host ACLs
  acl host_domain hdr(host) -i {% for domain in domain_names %}{{ domain }}{% if not loop.last %}|{% endif %}{% endfor %}

  # Serve ACME challenge files
  http-request set-var(txn.acme_path) path /.well-known/acme-challenge/
  use_backend be_letsencrypt if letsencrypt_challenge host_domain

  default_backend be_letsencrypt_default

# Let's Encrypt ACME backend - serves from /data/letsencrypt-acme-challenge
backend be_letsencrypt
  # Static file serving for ACME challenges
  http-request return status 200 file:/data/letsencrypt-acme-challenge/.well-known/acme-challenge/%[var(txn.acme_path),field(2)] if { var(txn.acme_path), -m found }

  # Fallback 404
  http-request return status 404 content-type "text/html" string "<html><body><h1>404 - Not Found</h1></body></html>"

# Default backend
backend be_letsencrypt_default
  http-request deny deny_status 750
